[project]
name = "urban-pulse"
version = "0.1.0"
description = "Amsterdam cycling, pedestrian and air quality data platform on DuckDB and Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "databricks-sql-connector>=4.4.0",
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "great-expectations>=1.19.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.53.0", "plotly>=5.22", "pandas<3"]

[dependency-groups]
dev = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.10.9",
    "delta-spark>=4.3.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pyspark>=4.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP046"]  # PEP 695 generics not yet supported by installed mypy — see git history

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_pulse"]
