include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse for the sql_task jobs (see databricks warehouses list)

sync:
  exclude:
    - "tests/**"
    - "docs/**"
    - "scripts/**"
    - "data/**"
    - "*.md"

run_as:
  user_name: ${workspace.current_user.userName}

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

bundle:
  name: urban-pulse

targets:
  dev:
    default: true